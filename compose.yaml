services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: study_platform
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d study_platform"]
      interval: 3s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgres://study:study@db:5432/study_platform?sslmode=disable
      ADDR: :8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
        required: false
volumes:
  postgres_data:
